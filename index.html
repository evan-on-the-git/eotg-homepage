<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Startpage</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #clock {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .search-box {
            margin-bottom: 30px;
        }
        .search-box input {
            padding: 12px 20px;
            width: 300px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #fff;
            outline: none;
            text-align: center;
        }
        .shortcuts {
            display: flex;
            gap: 15px;
        }
        .card {
            padding: 15px 25px;
            background: #1e1e1e;
            border-radius: 8px;
            color: #00adb5;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            background: #252525;
        }
    </style>
</head>
<body>

    <div id="clock">00:00:00</div>

    <form class="search-box" action="https://www.google.com/search" method="GET">
        <input type="text" name="q" placeholder="Search the web..." autofocus>
    </form>

    <div class="shortcuts">
        <a class="card" href="https://youtube.com">YouTube</a>
        <a class="card" href="https://github.com">GitHub</a>
        <a class="card" href="https://reddit.com">Reddit</a>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
