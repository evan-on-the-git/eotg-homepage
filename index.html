<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        #clock {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -1px;
            color: #ffffff;
        }

        /* Responsive Search Bar Container */
        .search-form {
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .search-form input {
            flex: 1;
            padding: 14px 18px;
            background: #1e1e22;
            border: 1px solid #2e2e34;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-form input:focus {
            border-color: #484854;
        }

        .search-btn {
            padding: 0 20px;
            background: #2e2e38;
            color: #fff;
            border: 1px solid #3e3e4a;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover, .search-btn:active {
            background: #3e3e4a;
        }

        .bookmarks {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        .card-wrapper {
            position: relative;
        }

        .bookmark-card {
            display: block;
            padding: 12px 14px;
            background: #1e1e22;
            border: 1px solid #2e2e34;
            border-radius: 10px;
            color: #c4c4cc;
            text-decoration: none;
            font-size: 0.9rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, color 0.2s;
        }

        .bookmark-card:hover {
            color: #fff;
            background: #282830;
        }

        .del-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e5484d;
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: none;
            line-height: 1;
        }

        .card-wrapper:hover .del-btn {
            display: block;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            #clock {
                font-size: 2.8rem;
            }
            
            .del-btn {
                display: block; /* Always visible on touch screens */
            }

            .add-box {
                flex-direction: column;
            }
        }

        .add-box {
            width: 100%;
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .add-box input {
            padding: 10px 14px;
            background: #18181c;
            border: 1px solid #2e2e34;
            border-radius: 8px;
            color: #eee;
            font-size: 0.85rem;
            outline: none;
        }

        .add-box input[type="text"]:nth-child(1) { flex: 1; }
        .add-box input[type="text"]:nth-child(2) { flex: 2; }

        .add-box button {
            padding: 10px 16px;
            background: #2e2e38;
            color: #fff;
            border: 1px solid #3e3e4a;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <main class="container">
        <header id="clock">00:00:00 AM</header>

        <form class="search-form" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" placeholder="Search Google..." autocomplete="off">
            <button type="submit" class="search-btn">Search</button>
        </form>

        <nav class="bookmarks" id="bookmarksGrid"></nav>

        <section class="add-box">
            <input type="text" id="siteTitle" placeholder="Label">
            <input type="text" id="siteUrl" placeholder="URL">
            <button type="button" id="addBtn">+ Add</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
