<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startpage</title>
    <style>
        /* CSS Variables for Themes */
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e22;
            --card-border: #2e2e34;
            --text-color: #e1e1e6;
            --text-muted: #8e8e93;
            --clock-color: #ffffff;
            --input-bg: #18181c;
            --button-bg: #2e2e38;
            --button-border: #3e3e4a;
            --button-hover: #3e3e4a;
            --card-hover: #282830;
            --modal-overlay: rgba(0, 0, 0, 0.75);
        }

        /* Light Theme Override */
        html[data-theme="light"] {
            --bg-color: #f4f4f6;
            --card-bg: #ffffff;
            --card-border: #d0d0d5;
            --text-color: #1c1c1e;
            --text-muted: #6e6e73;
            --clock-color: #1c1c1e;
            --input-bg: #ffffff;
            --button-bg: #e5e5ea;
            --button-border: #d0d0d5;
            --button-hover: #d1d1d6;
            --card-hover: #f0f0f5;
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Settings Gear Button */
        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
            z-index: 10;
        }

        .settings-btn:hover {
            color: var(--text-color);
            background: var(--card-hover);
            border-color: var(--button-border);
        }

        .settings-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            pointer-events: none;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--modal-overlay);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-color);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .setting-group select {
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        #clock {
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: -1px;
            color: var(--clock-color);
        }

        .search-form {
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .search-form input {
            flex: 1;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-form input:focus {
            border-color: var(--button-border);
        }

        .search-btn {
            padding: 0 20px;
            background: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--button-border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover, .search-btn:active {
            background: var(--button-hover);
        }

        .bookmarks {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }

        .card-wrapper {
            position: relative;
        }

        .bookmark-card {
            display: block;
            padding: 12px 14px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, color 0.2s;
        }

        .bookmark-card:hover {
            background: var(--card-hover);
        }

        .del-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e5484d;
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: none;
            line-height: 1;
        }

        .card-wrapper:hover .del-btn {
            display: block;
        }

        @media (max-width: 480px) {
            #clock {
                font-size: 2.8rem;
            }
            
            .del-btn {
                display: block;
            }

            .add-box {
                flex-direction: column;
            }
        }

        .add-box {
            width: 100%;
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .add-box input {
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
        }

        .add-box input[type="text"]:nth-child(1) { flex: 1; }
        .add-box input[type="text"]:nth-child(2) { flex: 2; }

        .add-box button {
            padding: 10px 16px;
            background: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--button-border);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Settings Gear Button -->
    <button type="button" class="settings-btn" id="openSettingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
    </button>

    <!-- Settings Modal Overlay -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Settings</h3>
                <button type="button" class="close-btn" id="closeSettingsBtn">&times;</button>
            </div>
            
            <div class="setting-group">
                <label for="themeSelect">Theme</label>
                <select id="themeSelect">
                    <option value="dark">Dark</option>
                    <option value="light">Clear (Light)</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="engineSelect">Search Engine</label>
                <select id="engineSelect">
                    <option value="google">Google</option>
                    <option value="duckduckgo">DuckDuckGo</option>
                    <option value="bing">Bing</option>
                    <option value="yahoo">Yahoo</option>
                </select>
            </div>
        </div>
    </div>

    <main class="container">
        <header id="clock">00:00:00 AM</header>

        <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET">
            <input type="text" id="searchInput" name="q" placeholder="Search..." autocomplete="off">
            <button type="submit" class="search-btn">Search</button>
        </form>

        <nav class="bookmarks" id="bookmarksGrid"></nav>

        <section class="add-box">
            <input type="text" id="siteTitle" placeholder="Label">
            <input type="text" id="siteUrl" placeholder="URL">
            <button type="button" id="addBtn">+ Add</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
