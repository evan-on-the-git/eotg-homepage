<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header id="clock">00:00:00 AM</header>

        <form class="search-form" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" placeholder="search web..." autocomplete="off" autofocus>
        </form>

        <nav class="bookmarks" id="bookmarksGrid"></nav>

        <section class="add-box">
            <input type="text" id="siteTitle" placeholder="label">
            <input type="text" id="siteUrl" placeholder="url">
            <button type="button" id="addBtn">+ add</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
